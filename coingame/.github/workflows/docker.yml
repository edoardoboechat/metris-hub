name: Build and Push Docker Image

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # importante para GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build JAR
        run: mvn -f backend-spring/pom.xml clean package -DskipTests

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/edoardoboechat/coingame:latest -f backend-spring/Dockerfile .

      - name: Push Docker image
        run: |
          docker push ghcr.io/edoardoboechat/coingame:latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/deploy/projeto
            docker compose pull backend
            docker compose up -d backend
            docker image prune -f
