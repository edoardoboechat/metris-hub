spring:
  application:
    name: aether-quest-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/aether_game
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:Hitachi$20261}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:Hitachi$20261}
  security:
    csrf:
      enabled: false  
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/aether-quest}

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  ssl:
    enabled: false
    key-store: classpath:certs/aetherquest-local.p12
    key-store-type: PKCS12
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:changeit}
    key-alias: aetherquest-local

logging:
  level:
    com.aetherquest: INFO

app:
  game:
    inactivity-timeout-seconds: ${APP_GAME_INACTIVITY_TIMEOUT_SECONDS:30}
    distribution-days: ${APP_GAME_DISTRIBUTION_DAYS:30}
    initial-available-coins: ${APP_GAME_INITIAL_AVAILABLE_COINS:0}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:aether-quest}
    client-id: ${KEYCLOAK_CLIENT_ID:aether-client}
    admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:Hitachi$20261}
