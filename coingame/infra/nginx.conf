server {
    listen 443 ssl;
    http2 on;
    server_name mars.metris.com.br mars.moneyback.com.br;

    ssl_certificate /etc/letsencrypt/live/moneyback.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moneyback.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass https://100.122.21.51:18789;
        
        # Suporte vital para WebSockets (Control UI do OpenClaw)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Headers padrão de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Ignorar erros de certificado auto-assinado no servidor # # Tailscale local
        proxy_ssl_verify off;
        
        # Timeouts alargados para manter WebSockets abertos sem quedas
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

