log_format detailed_json '[$time_local] client=$remote_addr method=$request method_uri=$uri status=$status body="$request_body";';

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name moneyback.com.br *.moneyback.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name moneyback.com.br;

    ssl_certificate /etc/letsencrypt/live/moneyback.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moneyback.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ~* \/\.env|/\.git|/\.hg|/\.svn|/\.htaccess|/\.htpasswd {
        deny all;
        return 404;
    }


    location / {
        proxy_pass http://backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}

